name: Release Check

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate (optional; defaults to current ref)"
        required: false
        type: string

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release notes
        run: |
          TAG_INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then
            python scripts/check_release_notes.py --tag "$TAG_INPUT"
          else
            python scripts/check_release_notes.py --tag "${GITHUB_REF_NAME}"
          fi
