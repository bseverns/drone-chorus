<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="195mm" viewBox="0 0 180 195">
  <defs>

<style>
.outline { stroke:#000; stroke-width:0.5; fill:none; }
.cut { stroke:#000; stroke-width:0.6; fill:none; }
.guide { stroke:#666; stroke-width:0.3; fill:none; stroke-dasharray:2 2; }
.centerline { stroke:#999; stroke-width:0.25; fill:none; stroke-dasharray:3 2; }
.hole { stroke:#000; stroke-width:0.28; fill:none; }
.slot { stroke:#000; stroke-width:0.28; fill:none; }
.note { font-family:Arial,sans-serif; font-size:3px; }
.small { font-family:Arial,sans-serif; font-size:2.4px; }
.zone { stroke:#444; stroke-width:0.3; fill:none; stroke-dasharray:4 2; }
</style>

  </defs>
  <rect x="0" y="0" width="180" height="195" fill="white"/>
  <g transform="translate(15,20)">
    <text class="note" x="0" y="-6">12_LAYOUT_OVERLAY.svg — non-cut planning overlay</text>
    <rect class="outline" x="7.50" y="7.50" width="135.00" height="135.00" rx="28.50" ry="28.50"/>
    <line class="centerline" x1="0" y1="75.00" x2="150" y2="75.00"/>
    <line class="centerline" x1="75.00" y1="0" x2="75.00" y2="150"/>

    <!-- Duct refs -->
    <circle class="guide" cx="36.00" cy="36.00" r="26"/>
    <circle class="guide" cx="114.00" cy="36.00" r="26"/>
    <circle class="guide" cx="36.00" cy="114.00" r="26"/>
    <circle class="guide" cx="114.00" cy="114.00" r="26"/>
    <circle class="guide" cx="36.00" cy="36.00" r="28.5"/>
    <circle class="guide" cx="114.00" cy="36.00" r="28.5"/>
    <circle class="guide" cx="36.00" cy="114.00" r="28.5"/>
    <circle class="guide" cx="114.00" cy="114.00" r="28.5"/>

    <!-- FC envelope -->
    <rect class="zone" x="54.00" y="54.00" width="42" height="42" rx="4"/>
    <text class="small" x="98.00" y="59.00">FC working envelope</text>

    <!-- Camera zone -->
    <rect class="zone" x="52" y="20" width="46" height="16" rx="4"/>
    <text class="small" x="100" y="30">camera bracket / lens zone</text>

    <!-- VTX zone -->
    <rect class="zone" x="100" y="44" width="20" height="18" rx="3"/>
    <text class="small" x="122" y="54">VTX zone</text>

    <!-- Receiver zone -->
    <rect class="zone" x="30" y="44" width="18" height="16" rx="3"/>
    <text class="small" x="4" y="54">ELRS zone</text>

    <!-- Battery zone -->
    <rect class="zone" x="58" y="98" width="34" height="30" rx="4"/>
    <text class="small" x="95" y="112">battery envelope target</text>

    <!-- Future MCU zone -->
    <rect class="zone" x="46" y="40" width="58" height="14" rx="3"/>
    <text class="small" x="108" y="42">optional future MCU / LED deck</text>

    <!-- Wire corridors -->
    <path class="guide" d="M 48 44 Q 58 58 63 72"/>
    <path class="guide" d="M 110 50 Q 101 60 92 72"/>
    <path class="guide" d="M 75 90 L 75 128"/>
    <text class="small" x="8" y="138">Suggested wire corridors: RX -> FC, VTX -> FC, battery lead -> rear/underside</text>

    <!-- Antenna path -->
    <path class="guide" d="M 39 52 Q 22 44 14 30"/>
    <text class="small" x="0" y="24">ELRS antenna exit</text>
    <path class="guide" d="M 118 54 Q 134 45 142 32"/>
    <text class="small" x="120" y="24">VTX antenna exit</text>

    <text class="small" x="0" y="160">Overlay only. Use with the cut files rather than sending this sheet directly to the machine.</text>
  </g>
</svg>
